name: 第二轮整合全量端到端对照

# Temporary branch only. Match ci.yml's runner, lockfile, Chromium, workers and shards.
on:
  push:
    branches: [review/stability-r2-integration]

permissions:
  contents: read

concurrency:
  group: stability-round2-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: 整合 Chromium 分片 ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 运行完整分片
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-report.json
        run: |
          set -o pipefail
          git rev-parse HEAD
          npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=line,json 2>&1 | tee e2e-output.txt
      - name: 保存全量证据
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: round2-integration-e2e-${{ matrix.shard }}
          path: |
            e2e-output.txt
            e2e-report.json
            test-results/
          retention-days: 7
          if-no-files-found: ignore
