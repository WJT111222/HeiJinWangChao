name: 三段变量复审浏览器对照
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  browser:
    if: github.head_ref == 'feat/three-variable-stages'
    name: ${{ matrix.arm }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arm: [feature]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.arm == 'release' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 对照桌面及移动端全部用例
        env:
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: comparison.json
        run: npm run test:e2e -- --shard="${SHARD}/8" --reporter=line,json --trace=off
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stage-rerun-${{ matrix.arm }}-${{ matrix.shard }}
          path: comparison.json
          retention-days: 7
