name: Story 工具接收 · PR 191 工程验收

on:
  push:
    branches: ['feat/ai-response-events']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 完整工程检查
        run: npm run check
      - name: Prompt 检查
        run: npm run prompts:check
      - name: 提交差异检查
        run: git show --check --format=oneline HEAD
