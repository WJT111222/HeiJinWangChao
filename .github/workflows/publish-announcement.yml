# main 上 announcements/current.json 有改动时，把它写入 Cloudflare KV 的 current 键（只读 Worker 随即返回新公告）。
# 不需要重新构建或部署游戏。逻辑在 scripts/publish-announcement.mjs，本文件只负责调度。
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN（权限仅 Workers KV Storage: Edit）、CLOUDFLARE_ACCOUNT_ID。
#
# 生产安全边界：
# - 只从 main 执行：job 级 if，脚本内再查一次 GITHUB_REF。手动运行选择其他分支时 job 直接跳过。
# - 防止旧运行覆盖新公告：concurrency 组串行执行；预装 wrangler 后重新 fetch 最新 main，
#   检出内容与此刻 main 上的公告不完全一致就跳过（成功退出、不写入）。
#   非原子：检查与写入之间 main 仍可能收到新提交，写入后会复查并提示；
#   排在后面的运行随后写入最新公告（最终一致）。
# - KV Namespace 按 wrangler.jsonc 中 binding = ANNOUNCEMENTS 精确读取，缺失或重复时失败、不写入。
name: 发布王朝公告

on:
  push:
    branches: [main]
    paths: ['announcements/current.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-announcement
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 校验公告
        run: node scripts/check-announcement.mjs announcements/current.json

      - name: 写入 Cloudflare KV（仅当仍是 main 上的最新公告）
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-announcement.mjs

      - name: 检查线上是否已由 KV 返回（同步延迟只警告）
        if: steps.publish.outputs.version != ''
        env:
          ANNOUNCEMENT_VERSION: ${{ steps.publish.outputs.version }}
        run: node scripts/publish-announcement.mjs --verify
