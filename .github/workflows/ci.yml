# 每个 PR、以及推送到 main 时，在 GitHub 的服务器上自动运行测试；结果显示在 PR 页面底部。
# 公开仓库使用 GitHub Actions 免费。只读权限，不使用任何 Secrets，不部署、不发布。
name: 自动测试

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 推送新提交时，取消还没跑完的旧一轮，只测最新的。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查、单元测试与构建（npm run check）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 依次运行：文件名检查、lint、Vitest 单元测试、命令目录检查、类型检查、Vite 构建
      - name: npm run check
        run: npm run check

  e2e:
    name: 端到端测试（Playwright，电脑端与手机端）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium 浏览器
        run: npx playwright install --with-deps chromium

      # playwright.config.ts 会自动启动开发服务器（CI 环境下不复用已有服务器）
      - name: npm run test:e2e
        run: npm run test:e2e

      - name: 失败时上传测试记录与截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
