.desk .notes{justify-self:end;max-width:22rem;font-size:.84rem;color:var(--muted);line-height:1.85}

.frame::before{content:'';position:absolute;left:50%;top:22px;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000;z-index:50}
.phone{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--bg);--safe-t:44px;--safe-b:22px;container-type:inline-size}
@media (max-width:600px){
  .desk{display:block;padding:0;height:100%}

  .frame::before{display:none}
  .phone{border-radius:0;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
}
@media (max-width:1100px) and (min-width:601px){.desk{grid-template-columns:auto;justify-content:center}.desk .notes,.desk .ctrl{display:none}}


.phone{background:#0a0b0b}
.behind{position:absolute;inset:0;border:0;width:100%;height:100%;pointer-events:none;filter:blur(2px) brightness(.5)}
.scrim{position:absolute;inset:0;background:#000a}

.doc{position:absolute;left:0;right:0;bottom:0;top:calc(var(--safe-t) + 8px);display:flex;flex-direction:column;border-radius:22px 22px 0 0;overflow:hidden;

.doc.out-l{transform:translateX(-30%);opacity:0;pointer-events:none}
.doc.out-r{transform:translateX(100%);pointer-events:none}
.doc.in{animation:up .4s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{flex:none;display:grid;place-items:center;padding:.55rem 0 0}.grab i{width:2.4rem;height:4px;border-radius:2px;background:#ffffff2a}
.dh{flex:none;display:flex;align-items:center;gap:.65rem;padding:.55rem 14px .5rem}
.dh .seal{width:2.3rem;height:2.3rem;font-size:1rem}
.dh .t{flex:1;min-width:0}
.dh small{display:block;font-family:var(--font-mono);font-size:.5rem;letter-spacing:.28em;color:var(--gold)}
.dh h2{font-size:1.02rem;letter-spacing:.06em;background:linear-gradient(180deg,#f5e3b0,#c9a961);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .x{flex:none;width:2.2rem;height:2.2rem;padding:0;border:0;border-radius:50%;background:#ffffff0d;color:var(--muted);font-size:1rem}

.steps .on{color:var(--gold-hi)}.steps .on i{background:linear-gradient(180deg,#e9d196,#c5a45a);color:#171810;border:0}
.steps .ok{color:var(--gold)}.steps .ok i{border-color:var(--gold);color:var(--gold)}
.steps b{width:2rem;height:1px;background:#ffffff22}
/* 章节横条 */
.toc{flex:none;position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0f1211}
.toc .rail{display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none;padding:.5rem 14px;scroll-behavior:smooth}
.toc .rail::-webkit-scrollbar{display:none}
.toc button{flex:none;display:flex;align-items:center;gap:.35rem;padding:.3rem .7rem;border-radius:999px;font-size:.72rem;color:var(--muted);background:#ffffff06;border-color:var(--line)}
.toc button i{font-style:normal;font-family:var(--font-title);font-size:.68rem;color:var(--dim)}
.toc button[aria-current=true]{color:#171810;background:linear-gradient(180deg,#e9d196,#c5a45a);border-color:transparent;font-weight:600}
.toc button[aria-current=true] i{color:#171810}
.toc .prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}

.toc .pct{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;padding:0 12px 0 22px;font-family:var(--font-mono);font-size:.6rem;color:var(--gold-hi);background:linear-gradient(90deg,transparent,#0f1211 30%);pointer-events:none}

.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:1.1rem 20px 1.6rem;scrollbar-width:none}

.notice-age{flex:none;width:3.4rem;height:3.4rem;display:grid;place-items:center;border-radius:50%;border:2px solid #D47C60;color:#D47C60;font-family:var(--font-title);font-size:1.1rem;font-weight:700;transform:rotate(-10deg);box-shadow:inset 0 0 0 3px #131715,inset 0 0 0 4px #D47C6055}
.age strong{font-size:.92rem;line-height:1.6;color:#F1E6C8;font-weight:600}
.body p{font-family:var(--font-title);font-size:1rem;line-height:2;color:#D9D4C6;margin:0 0 .9em;text-align:justify}
.body p.em{padding:.5rem .8rem;border-left:2px solid var(--gold);background:linear-gradient(90deg,#c9a96114,transparent 80%);color:#F1E6C8}
.body h3{display:flex;align-items:center;gap:.6rem;font-size:1.08rem;letter-spacing:.1em;color:var(--gold-hi);margin:1.7rem 0 .8rem;scroll-margin-top:.6rem}
.body h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#c9a96155,transparent)}
.div{display:flex;align-items:center;gap:.8rem;margin:1.6rem 0;color:var(--gold-lo);font-size:.6rem}
.div::before,.div::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9a96144,transparent)}
.closing p{text-align:center}
.closing p.em{border:0;background:none;padding:0;color:#F1E6C8}
.sign{display:flex;align-items:center;justify-content:flex-end;gap:.8rem;margin-top:.4rem}
.sign p{margin:0!important;text-align:right!important}
.stamp{width:3rem;height:3rem;display:grid;place-items:center;text-align:center;font-family:var(--font-title);font-size:.7rem;line-height:1.15;color:var(--gold-hi);border:1.5px solid var(--gold-lo);border-radius:3px;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px #0e1110,inset 0 0 0 4px #c9a96144}
.end{display:block;text-align:center;font-size:.62rem;letter-spacing:.3em;color:var(--dim);margin-top:1.4rem}
/* 公告 */
.ver{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-mono);font-size:.58rem;letter-spacing:.2em;padding:.18rem .65rem;border-radius:999px;color:var(--gold-hi);border:1px solid var(--gold-lo);background:#c9a96112;margin-bottom:.8rem}
.notice-theme{font-family:var(--font-title);font-size:1.32rem;line-height:1.55;letter-spacing:.04em;color:#F1E6C8;margin:0 0 1.2rem}
.ups{list-style:none;margin:0;padding:0;position:relative}
.ups::before{content:'';position:absolute;left:1.05rem;top:1rem;bottom:1rem;width:1px;background:linear-gradient(#c9a96155,#c9a96111)}

.ups p{margin:0!important;font-family:var(--font-body)!important;font-size:.88rem!important;line-height:1.85!important;padding-top:.2rem}
.notice-message{margin:.6rem 0 0!important;padding:1rem 1.1rem;border-radius:12px;background:#ffffff07;border:1px solid var(--line);color:#F1E6C8!important;text-align:left!important}
.notice-message::before{content:'「';color:var(--gold)}.notice-message::after{content:'」';color:var(--gold)}

.mute{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--muted);white-space:nowrap}
.mute input{appearance:none;width:1.25rem;height:1.25rem;margin:0;border-radius:4px;border:1.5px solid #ffffff40;display:grid;place-items:center}
.mute input:checked{background:linear-gradient(180deg,#e9d196,#c5a45a);border-color:transparent}
.mute input:checked::after{content:'✓';font-size:.75rem;color:#171810;font-weight:700}

.toast{position:absolute;left:50%;top:calc(var(--safe-t) + 60px);z-index:60;transform:translate(-50%,-8px);padding:.45rem .9rem;border-radius:999px;background:#1a1f1c;border:1px solid var(--line-2);font-size:.76rem;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

   <li><b>拇指区底栏</b>：「今日不再弹出」和主按钮都在最下面。</li>
